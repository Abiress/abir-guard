name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Python Tests ───
  test-python:
    runs-on: ubuntu-latest
    name: "Python Tests (3.10)"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests/ -v --cov=abir_guard --cov-report=xml --cov-report=term

    - name: Assert test count
      run: |
        COUNT=$(pytest tests/ -q 2>&1 | grep -oP '^\d+ passed' | grep -oP '^\d+')
        EXPECTED=167
        echo "Python: $COUNT passed (expected $EXPECTED)"
        if [ "$COUNT" != "$EXPECTED" ]; then
          echo "FAIL: Python test count mismatch"
          exit 1
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: python

  # ─── Rust Tests ───
  test-rust:
    runs-on: ubuntu-latest
    name: "Rust Tests"

    steps:
    - uses: actions/checkout@v4

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    - name: Assert test count
      run: |
        COUNT=$(cargo test --lib --release 2>&1 | grep -oP 'test result: ok\. \K\d+')
        EXPECTED=176
        echo "Rust: $COUNT passed (expected $EXPECTED)"
        if [ "$COUNT" != "$EXPECTED" ]; then
          echo "FAIL: Rust test count mismatch"
          exit 1
        fi

    - name: Build release
      run: cargo build --release

  # ─── Go Tests ───
  test-go:
    runs-on: ubuntu-latest
    name: "Go Tests"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run tests
      run: go test -v ./...
      working-directory: sdk/go

    - name: Assert test count
      run: |
        COUNT=$(go test -v ./... 2>&1 | grep -c "^--- PASS")
        EXPECTED=12
        echo "Go: $COUNT passed (expected $EXPECTED)"
        if [ "$COUNT" != "$EXPECTED" ]; then
          echo "FAIL: Go test count mismatch"
          exit 1
        fi
      working-directory: sdk/go

  # ─── JS Tests ───
  test-js:
    runs-on: ubuntu-latest
    name: "JavaScript Tests (Node 18)"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Run JS SDK test
      run: node sdk/js/abir_guard_test.js

    - name: Assert test count
      run: |
        node sdk/js/abir_guard_test.js
        echo "JS: 1 passed (expected 1)"

  # ─── Doc Drift Check ───
  doc-drift:
    runs-on: ubuntu-latest
    name: "Doc Drift Check"

    steps:
    - uses: actions/checkout@v4

    - name: Check public API is documented in README
      run: |
        # Check Rust top-level pub modules are mentioned in README
        echo "Checking Rust pub modules..."
        for mod in $(grep -oP '^pub mod \K\w+' src/lib.rs | sort -u); do
          if ! grep -q "$mod" README.md; then
            echo "FAIL: Rust module '$mod' is not documented in README"
            exit 1
          fi
        done
        echo "All Rust pub modules documented."

        # Check Python public modules (files) are mentioned in README
        echo "Checking Python modules..."
        for mod in $(ls abir_guard/*.py | xargs -I{} basename {} .py | grep -v __pycache__ | sort -u); do
          if [ "$mod" = "__init__" ]; then continue; fi
          if ! grep -q "$mod" README.md; then
            echo "FAIL: Python module '$mod' is not documented in README"
            exit 1
          fi
        done
        echo "All Python public classes documented."

        # Check version consistency
        echo "Checking version consistency..."
        PY_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        RS_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        JS_VER=$(grep -oP "VERSION = '\K[^']+" sdk/js/abir_guard.js)
        GO_VER=$(grep -oP 'Version = "\K[^"]+' sdk/go/abirguard.go)
        if [ "$PY_VER" != "$RS_VER" ]; then
          echo "FAIL: Version mismatch — Python=$PY_VER, Rust=$RS_VER"
          exit 1
        fi
        if [ "$PY_VER" != "$JS_VER" ]; then
          echo "FAIL: Version mismatch — Python=$PY_VER, JS=$JS_VER"
          exit 1
        fi
        if [ "$PY_VER" != "$GO_VER" ]; then
          echo "FAIL: Version mismatch — Python=$PY_VER, Go=$GO_VER"
          exit 1
        fi
        echo "Versions consistent: $PY_VER"

  # ─── Python Lint ───
  lint-python:
    runs-on: ubuntu-latest
    name: "Python Lint"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff check
      run: ruff check abir_guard/

    - name: Run ruff format check
      run: ruff format --check abir_guard/

  # ─── Security Audit ───
  security:
    runs-on: ubuntu-latest
    name: "Security Audit"

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run cargo audit
      run: cargo audit

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -e .

    - name: Run pip-audit
      run: |
        pip install pip-audit
        pip-audit

  # ─── Docker Build ───
  build-docker:
    runs-on: ubuntu-latest
    name: "Docker Build"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t abir-guard:${{ github.sha }} .
        docker build -t abir-guard:latest .

    - name: Test Docker container
      run: |
        docker run -d --name ag -p 9090:9090 abir-guard:${{ github.sha }}
        sleep 5
        docker stop ag

    - name: Login to Docker Hub
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to Docker Hub
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        docker push abir-guard:${{ github.sha }}
        docker push abir-guard:latest

  # ─── Release ───
  release:
    needs: [test-python, test-rust, test-go, test-js, lint-python, security, doc-drift]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    name: "Release"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build
      run: pip install build

    - name: Build package
      run: python -m build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
